spring.application.name=Expenses Mangement Application
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/expense_management
spring.datasource.username=root
spring.datasource.password=zerobear

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Producer serialization
# Connection
spring.kafka.bootstrap-servers=localhost:9092

# ==============================
# Producer Serializer
# ==============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.zerobear.serializer.ExpenseEventSerializer

# ==============================
# Consumer Deserializer
# ==============================
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.zerobear.deserializer.ExpenseDeserializer

# Consumer Group
spring.kafka.consumer.group-id=expense-group
spring.kafka.consumer.auto-offset-reset=earliest

#topic
kafka.events.expense.topic=user-expense-event
kafka.user.ack.topic=user-ack-event

logging.level.org.springframework.kafka.listener.DeadLetterPublishingRecoverer=TRACE
logging.level.org.springframework.kafka.listener.DefaultErrorHandler=DEBUG