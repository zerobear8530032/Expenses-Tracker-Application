spring.application.name=ExpensesManagementApplication
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/expense_management
spring.datasource.username=root
spring.datasource.password=zerobear

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.kafka.bootstrap-servers=localhost:9092

# Producer serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.zerobear.AuthService.serializer.UserSerializer
# Consumer deserialization (useful when you add a consumer later)
spring.kafka.consumer.group-id=user-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.zerobear.AuthService.deserializer.UserEventDeserializer
spring.kafka.consumer.properties[spring.json.trusted.packages]=org.OrderProducer.entity

kafka.events.user.topic=user-register-event