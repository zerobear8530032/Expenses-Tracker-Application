spring.application.name=Message Parse Service
server.port=8083
# Gemini API key
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=gemma3:4b


# Producer serialization
# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Consumer Group
spring.kafka.consumer.group-id=expense-group
spring.kafka.consumer.auto-offset-reset=earliest

# JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.zerobear.*

#topic
kafka.events.expense.topic=user-expense-event